<section class="get-to-know">
  <div class="grid">
    <div class="left">
      <img [src]="leftImage" alt="Know us left" class="left-img" draggable="false" />
    </div>
    <div class="right">
      <a routerLink="/get2knowvus" class="right-img-link">
        <img
          [src]="rightImage"
          alt="Know us right"
          class="right-img with-opacity"
          draggable="false"
        />
      </a>
      <div class="overlay">
        <a routerLink="/get2knowvus" class="text-content">
          <h2 class="title">
            <span class="title-prefix">GET TO KNOW</span>
            <span class="title-word"> <span class="title-v">V</span>ÜS </span>
          </h2>
          <p class="slogan">{{ slogan }}</p>
        </a>
        <a routerLink="/get2knowvus" class="logo-link">
          <img class="logo" [src]="logoSrc" alt="logo" draggable="false" />
        </a>
      </div>
    </div>
  </div>
</section>
